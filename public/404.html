<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect to the SPA with the path encoded as a query parameter
      var path = window.location.pathname;
      window.location.replace('/?p=' + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
